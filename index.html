<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Jump</title>
<style>
  :root{
    --bg:#f7f7f7; --fg:#535353; --line:#535353;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1e1e1e; --fg:#cfcfcf; --line:#cfcfcf; }
  }
  html,body{height:100%;margin:0;background:var(--bg);}
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Courier New', monospace; color:var(--fg); gap:12px;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  h1{font-size:18px; letter-spacing:2px; margin:4px 0;}
  #wrap{ position:relative; width:min(94vw,900px); }
  canvas{
    width:100%; display:block; background:var(--bg);
    border-bottom:2px solid var(--line);
    touch-action:none;
  }
  #hint{font-size:13px; opacity:.7; text-align:center; max-width:90vw;}
  #score{font-size:16px; letter-spacing:1px;}
  #overlay{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; pointer-events:none;
  }
  #overlay span{font-size:16px; opacity:.85;}
  button{
    font-family:inherit; font-size:14px; padding:8px 18px; margin-top:4px;
    background:transparent; color:var(--fg); border:2px solid var(--fg);
    border-radius:4px; pointer-events:auto; cursor:pointer;
  }
  button:active{opacity:.6;}
</style>
</head>
<body>
<div id="score">HI 00000&nbsp;&nbsp;&nbsp;00000</div>
<div id="wrap">
  <canvas id="c"></canvas>

</div>

  function initSceneProps(){
    bgProps = [];
    for(let i=0;i<5;i++){
      bgProps.push({ x: (i/5)*W*1.6 + Math.random()*80, seed: Math.random() });
    }
  }

  let audioCtx = null;
  function getAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playJumpSound(){
    const a = getAudio(); if(!a) return;
    const t0 = a.currentTime;
    const osc = a.createOscillator(), gain = a.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(320, t0);
    osc.frequency.exponentialRampToValueAtTime(680, t0+0.09);
    gain.gain.setValueAtTime(0.12, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+0.12);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(t0); osc.stop(t0+0.13);
  }
  function playHitSound(){
    const a = getAudio(); if(!a) return;
    const t0 = a.currentTime;
    const bufferSize = a.sampleRate * 0.25;
    const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = a.createBufferSource(); noise.buffer = buffer;
    const filter = a.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(900, t0);
    const gain = a.createGain(); gain.gain.setValueAtTime(0.35, t0); gain.gain.exponentialRampToValueAtTime(0.001, t0+0.25);
    noise.connect(filter); filter.connect(gain); gain.connect(a.destination);
    noise.start(t0); noise.stop(t0+0.25);

    const osc = a.createOscillator(), oGain = a.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, t0);
    osc.frequency.exponentialRampToValueAtTime(50, t0+0.2);
    oGain.gain.setValueAtTime(0.18, t0);
    oGain.gain.exponentialRampToValueAtTime(0.001, t0+0.2);
    osc.connect(oGain); oGain.connect(a.destination);
    osc.start(t0); osc.stop(t0+0.2);
  }

  function loadHi(){ try{ return parseInt(localStorage.getItem('dino_hi')||'0',10);}catch(e){return 0;} }
  function saveHi(v){ try{ localStorage.setItem('dino_hi', String(v)); }catch(e){} }
  hi = loadHi();

  function reset(){
    dino = { x:16, y:0, w:26, h:36, vy:0, ducking:false, onGround:true, legFrame:0, legTimer:0 };
    obstacles = [];
    clouds = [];
    for(let i=0;i<3;i++) clouds.push({x: Math.random()*800+200*i, y: 15+Math.random()*40, w:46+Math.random()*20});
    speed = 0.32;
    distance = 0;
    groundOffset = 0;
    running = false;
    gameOver = false;
    sceneIndex = 0;
    sceneTrans = { active:false, t:0, duration:700, next:0, switched:false };
    initSceneProps();
  }

  function spawnObstacle(){
    const isBird = distance > 500 && Math.random() < 0.22;
    if(isBird){
      const h = 16, y = groundY - h - Math.random()*14;
      obstacles.push({type:'bird', x:W+20, y:y, w:26, h:h, frame:0, timer:0});
    } else {
      const clusters = [1,1,1,2,3];
      const n = clusters[Math.floor(Math.random()*clusters.length)];
      const w = 14, h = 26 + (n>1?4:0);
      obstacles.push({type:'cactus', x:W+20, y: groundY - h, w: w*n*0.9, h:h, n:n});
    }
  }

  let nextSpawnDist = 300;

  function startGame(){
    reset();
    running = true;
    overlay.style.display = 'none';
    nextSpawnDist = 300;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false; gameOver = true;
    playHitSound();
    if(Math.floor(distance/10) > hi){ hi = Math.floor(distance/10); saveHi(hi); }
    msg.textContent = 'เกมจบแล้ว! กด Space หรือแตะเพื่อเริ่มใหม่';
    startBtn.textContent = 'เล่นอีกครั้ง';
    overlay.style.display = 'flex';
  }

  function jump(){
    if(!running && !gameOver){ startGame(); return; }
    if(!running && gameOver){ startGame(); return; }
    if(dino.onGround){
      dino.vy = JUMP_V;
      dino.onGround = false;
      playJumpSound();
    }
  }
  function duckStart(){ if(running) dino.ducking = true; }
  function duckEnd(){ dino.ducking = false; }

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); jump(); }
    if(e.code === 'ArrowDown'){ e.preventDefault(); duckStart(); }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.code === 'ArrowDown') duckEnd();
  });
  canvas.addEventListener('pointerdown', (e)=>{ jump(); });
  startBtn.addEventListener('click', ()=>{ startGame(); });

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  let lastTime = 0;
  function loop(t){
    if(!running) return;
    let dt = t - lastTime; lastTime = t;
    dt = Math.min(dt, 40);

    // physics
    speed += 0.0000025 * dt;
    distance += speed * dt;
    groundOffset -= speed*dt;
    if(groundOffset < -20) groundOffset += 20;

    dino.h = dino.ducking && dino.onGround ? 22 : 36;
    if(!dino.onGround){
      dino.vy += GRAV*dt;
      dino.y += dino.vy*dt;
      if(dino.y >= 0){ dino.y = 0; dino.vy = 0; dino.onGround = true; }
    } else {
      dino.legTimer += dt;
      if(dino.legTimer > 100){ dino.legTimer = 0; dino.legFrame = 1-dino.legFrame; }
    }

    clouds.forEach(c=>{ c.x -= speed*dt*0.3; if(c.x < -60){ c.x = W+Math.random()*100; c.y = 15+Math.random()*50; } });
    bgProps.forEach(p=>{ p.x -= speed*dt*0.16; if(p.x < -180) p.x += W + 360; });

    // scene switching every SCENE_SCORE_STEP points, with a dark transition
    const curScore = Math.floor(distance/10);
    const rawIdx = Math.floor(curScore / SCENE_SCORE_STEP) % SCENE_COUNT;
    if(rawIdx !== sceneIndex && !sceneTrans.active){
      sceneTrans.active = true; sceneTrans.t = 0; sceneTrans.next = rawIdx; sceneTrans.switched = false;
    }
    if(sceneTrans.active){
      sceneTrans.t += dt;
      if(sceneTrans.t >= sceneTrans.duration/2 && !sceneTrans.switched){
        sceneIndex = sceneTrans.next;
        initSceneProps();
        sceneTrans.switched = true;
      }
      if(sceneTrans.t >= sceneTrans.duration) sceneTrans.active = false;
    }

    if(distance > nextSpawnDist){
      spawnObstacle();
      nextSpawnDist = distance + 260 + Math.random()*260 - Math.min(speed*100,100);
    }
    obstacles.forEach(o=>{
      o.x -= speed*dt;
      if(o.type==='bird'){ o.timer += dt; if(o.timer>150){o.timer=0; o.frame=1-o.frame;} }
    });
    obstacles = obstacles.filter(o=>o.x+o.w > -10);

    // collision
    const dBox = { x: dino.x+4, y: groundY-36-(-dino.y)+(36-dino.h), w: dino.w-6, h: dino.h-3 };
    for(const o of obstacles){
      const oBox = { x:o.x+4, y:o.y+2, w:o.w-8, h:o.h-4 };
      if(rectsOverlap(dBox, oBox)){ endGame(); break; }
    }

    draw();
    if(running) requestAnimationFrame(loop);
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawDino(){
    const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg');
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg');
    const baseH = 36;
    const dy = groundY - baseH - (-dino.y) + (baseH - dino.h);
    const x = dino.x, y = dy, w = dino.w, h = dino.h;
    const scale = h / baseH;
    ctx.fillStyle = fg;

    const headS = 11 * scale;
    const torsoW = w * 0.62, torsoX = x + (w - torsoW) * 0.5, torsoH = 14 * scale;
    const torsoY = y + headS - 1;
    const legW = 3.6 * scale, legH = Math.max(4, 11 * scale);

    if(dino.ducking && dino.onGround){
      // crouched: low flat block with small head bump
      roundRect(ctx, x-2, y+h-9*scale, w+8, 9*scale, 2*scale); ctx.fill();
      roundRect(ctx, x+w*0.22, y, headS, headS, 3*scale); ctx.fill();
    } else {
      // legs (side view, straight stance with a light running sway)
      const swing = dino.onGround ? (dino.legFrame===0 ? 1 : -1) : 0.2;
      ctx.fillRect(torsoX + torsoW*0.62, torsoY+torsoH-2, legW, legH + swing*1.6*scale); // back leg
      ctx.fillRect(torsoX + torsoW*0.06, torsoY+torsoH-2, legW, legH - swing*1.6*scale); // front leg

      // torso
      roundRect(ctx, torsoX, torsoY, torsoW, torsoH, 2*scale);
      ctx.fill();

      // arm (side view, one visible, close to body)
      const armSwing = dino.onGround ? -swing*1.2*scale : 1.2*scale;
      ctx.fillRect(torsoX + torsoW*0.66, torsoY+2*scale, 3*scale, 9*scale + armSwing);

      // head (rounded), centered over torso
      const headX = torsoX + (torsoW - headS) * 0.5 + torsoW*0.06;
      roundRect(ctx, headX, y, headS, headS, 3.5*scale);
      ctx.fill();

      // face: simple smile arc facing forward (right)
      ctx.strokeStyle = bg; ctx.lineWidth = Math.max(1, 1.2*scale);
      ctx.beginPath();
      ctx.arc(headX + headS*0.62, y + headS*0.62, headS*0.22, 0.15*Math.PI, 0.85*Math.PI);
      ctx.stroke();
    }
  }

  function drawObstacle(o){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg');
    if(o.type==='cactus'){
      const seg = o.w/(o.n||1);
      for(let i=0;i<(o.n||1);i++){
        ctx.fillRect(o.x+i*seg, o.y, seg*0.55, o.h);
      }
    } else {
      const y = o.frame===0? o.y : o.y-4;
      ctx.fillRect(o.x, y, o.w, o.h*0.5);
      ctx.fillRect(o.x+10, y-8, 14, 8);
    }
  }

  const SCENE_IMAGES = ['city','ruins','alien','forest'].map(name=>{
    const img = new Image();
    img.src = 'data:image/jpeg;base64,' + SCENE_B64[name];
    return img;
  });

  function drawPhotoScene(img){
    if(!img || !img.complete || !img.naturalWidth){ ctx.fillStyle = '#cfd8dc'; ctx.fillRect(0,0,W,groundY); return; }
    // cover-fit the photo into the sky area (0,0,W,groundY), biased to keep the
    // upper part of the photo (sky/structures) rather than centering into the
    // dark grass/ground band that sits at the bottom of these source photos
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(W/iw, groundY/ih);
    const dw = iw*scale, dh = ih*scale;
    const dx = (W-dw)/2;
    const dy = dh <= groundY ? (groundY-dh)/2 : -(dh-groundY)*0.12;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function drawScene(){
    drawPhotoScene(SCENE_IMAGES[sceneIndex]);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg');
    drawScene();

    // ground: solid black floor strip under the character's feet
    ctx.fillStyle = '#000';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = fg; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.fillStyle = '#555';
    for(let x = groundOffset; x < W; x += 16){
      ctx.fillRect(x, groundY+3, 6, 1.5);
    }

    obstacles.forEach(drawObstacle);
    drawDino();

    if(sceneTrans.active){
      const half = sceneTrans.duration/2;
      const alpha = sceneTrans.t < half ? sceneTrans.t/half : 1 - (sceneTrans.t-half)/half;
      ctx.fillStyle = '#000';
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha = 1;
    }

    const cur = Math.floor(distance/10);
    scoreEl.textContent = 'HI ' + String(hi).padStart(5,'0') + '   ' + String(cur).padStart(5,'0');
  }

  function init(){
    resize();
    reset();
    draw();
    msg.textContent = 'พร้อมกระโดดหรือยัง?';
    overlay.style.display = 'flex';
  }
  window.addEventListener('resize', ()=>{ resize(); if(!running) draw(); });
  init();
})();
</script>
</body>
</html>
