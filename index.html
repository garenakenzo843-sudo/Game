<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Jump</title>
<style>
  :root{
    --bg:#f7f7f7; --fg:#535353; --line:#535353;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1e1e1e; --fg:#cfcfcf; --line:#cfcfcf; }
  }
  html,body{height:100%;margin:0;background:var(--bg);}
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Courier New', monospace; color:var(--fg); gap:12px;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  h1{font-size:18px; letter-spacing:2px; margin:4px 0;}
  #wrap{ position:relative; width:min(94vw,900px); }
  canvas{
    width:100%; display:block; background:var(--bg);
    border-bottom:2px solid var(--line);
    touch-action:none;
  }
  #hint{font-size:13px; opacity:.7; text-align:center; max-width:90vw;}
  #score{font-size:16px; letter-spacing:1px;}
  #overlay{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; pointer-events:none;
  }
  #overlay span{font-size:16px; opacity:.85;}
